<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        margin: 0;
        padding-top: 5vh;
        padding-bottom: 5vh;
        overflow-y: auto;
    }

    .container {
        background: white;
        padding: 5%;
        border-radius: 1.5rem;
        box-shadow: 0 1vw 2vw rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 400px;
        text-align: center;
    }

    input {
        width: 90%;
        padding: 1em;
        margin: 1em 0;
        border: 0.1em solid #ccc;
        border-radius: 0.5em;
        font-size: 1em;
    }

    button {
        width: 90%;
        padding: 1em;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 0.5em;
        font-size: 1em;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    button:hover {
        background-color: #0056b3;
    }

    p {
        margin-top: 1em;
        font-size: 0.9em;
    }

    a {
        color: #007bff;
        text-decoration: none;
    }

    a:hover {
        text-decoration: underline;
    }

</style>
<body>
<div id="log_div" class="container">
    <input id="login_log" name="login" type="text" placeholder="Введите логин">
    <input id="password_log" name="password" type="password" placeholder="Введите пароль">
    <p id="mess_log" style="color: red"></p>
    <button id="log">Войти</button>
    <p>Нет аккаунта? <a>Зарегистрироваться</a></p>
</div>
<div id="reg_div" style="display: none" class="container">
    <input id="name" name="name" type="text" placeholder="Введите имя">
    <input id="lastname" name="lastname" type="text" placeholder="Введите фамилия">
    <input id="email" name="email" type="email" placeholder="Введите адрес электронной почты">
    <input id="phone" name="phone" type="text" placeholder="Введите номер телефона">
    <input id="login" name="login" type="text" placeholder="Введите логин">
    <input id="password" name="password" type="password" placeholder="Введите пароль">
    <input id="password_reset" name="password" type="password" placeholder="Повторите пароль">
    <p id="mess" style="color: red"></p>
    <button id="registration">Зарегистрироваться</button>
    <br>
    <p>Нет аккаунта? <a>Зарегистрироваться</a></p>
</div>
<div id="hello_div" style="display: none" class="container">
    <h1 id="h_hello"></h1>
    <button id="logout">Выйти</button>
</div>
<script>
    $(document).ready(function () {
        $('a').on('click', function () {
            reg_log_toogle()
        })

        $('#logout').on('click', function () {
            $('#log_div').toggle();
            $('#hello_div').toggle();
            $('#login_log').val('')
            $('#password_log').val('')
            $("#mess_log").text('');
        })

        $("#registration").on('click', function () {
            let name = $('#name').val();
            let lastname = $('#lastname').val();
            let email = $('#email').val();
            let phone = $('#phone').val();
            let login = $('#login').val();
            let password = $('#password').val();
            let password_reset = $('#password_reset').val();
            let $btn = $(this);
            $btn.prop("disabled", true);
            $.ajax({
                url: 'https://test/registration_22.php',
                type: 'POST',
                data: {
                    'name': name,
                    'lastname': lastname,
                    'email': email,
                    'phone': phone,
                    'login': login,
                    'password': password,
                    'password_reset': password_reset
                },
                dataType: 'json',
                success: function (response) {
                    if (response.status === "success") {
                        reg_log_toogle();
                    } else {
                        $("#mess").text(response.message);
                    }
                    $btn.prop("disabled", false);
                },
                // complete: function () {
                //     setTimeout(function () {
                //         $btn.prop("disabled", false);
                //     }, 3000);
                // }
            });
        });

        $("#log").on('click', function () {
            let login = $('#login_log').val();
            let password = $('#password_log').val();

            $.ajax({
                url: 'https://test/login_22.php',
                type: 'POST',
                data: {'login': login, 'password': password},
                dataType: 'json',
                success: function (response) {
                    if (response.status === "success") {
                        $('#log_div').hide();
                        $('#reg_div').hide();

                        $('#hello_div').show();
                        $('#h_hello').text(response.message);
                    } else {
                        $("#mess_log").text(response.message);

                    }
                }
            });
        });
    });

    function reg_log_toogle() {
        $('#log_div').toggle();
        $('#reg_div').toggle();
    }

</script>
</body>
</html>
